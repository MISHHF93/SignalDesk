    <script>
      (function() {
        // Suppress benign browser extension service worker disconnects & unresponded message channels
        var benignPatterns = [
          'Could not establish connection',
          'Receiving end does not exist',
          'Extension context invalidated',
          'message port closed',
          'message channel closed',
          'A listener indicated an asynchronous response by returning true',
          'asynchronous response by returning true',
          'The message port closed before a response was received',
          'message port closed before a response was received'
        ];

        function isBenign(str) {
          if (typeof str !== 'string') return false;
          for (var i = 0; i < benignPatterns.length; i++) {
            if (str.indexOf(benignPatterns[i]) !== -1) return true;
          }
          return false;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason ? (event.reason.message || event.reason) : '');
          if (isBenign(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var message = event && (event.message || '');
          if (isBenign(message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Filter benign extension errors from console.error without affecting application errors
        var originalConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && arg.message ? arg.message : '');
            if (isBenign(str)) {
              return;
            }
          }
          return originalConsoleError.apply(console, arguments);
        };
      })();
    </script>
